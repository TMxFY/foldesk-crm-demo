name: deploy-vps

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite & design/launch gates
        run: |
          python -m pytest -q -k "not playwright"
          bash ./scripts/verify.sh --fast-checks-only
          python .claude/skills/replica-design/contrast.py replica/design/tokens.json
          python .claude/skills/replica-launch/listing.py replica/launch/listing.json

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Contabo VPS (169.58.145.85) with rollback guard
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SERVER_HOST || '169.58.145.85' }}
          username: ${{ vars.SERVER_USER || 'root' }}
          port: ${{ vars.SERVER_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            APP_DIR="/opt/crmtg"
            TARGET_SHA="${{ github.sha }}"
            cd "$APP_DIR"

            PREV_SHA="$(git rev-parse HEAD)"
            echo "Deploying crmtg: $PREV_SHA -> $TARGET_SHA"

            mkdir -p -m 700 "$APP_DIR/backups"
            chmod 700 "$APP_DIR/backups"
            if [ -f "$APP_DIR/data/crm.db" ]; then
              OLD_UMASK="$(umask)"
              umask 077
              "$APP_DIR/.venv/bin/python" -c "import sqlite3; s=sqlite3.connect('$APP_DIR/data/crm.db', timeout=30); d=sqlite3.connect('$APP_DIR/backups/crm.db.pre-${TARGET_SHA:0:8}'); s.backup(d); d.close(); s.close()"
              chmod 600 "$APP_DIR/backups/crm.db.pre-${TARGET_SHA:0:8}"
              umask "$OLD_UMASK"
              ls -1t "$APP_DIR/backups"/crm.db.pre-* 2>/dev/null | tail -n +11 | xargs -r rm -f
            fi

            git fetch origin main
            git reset --hard "$TARGET_SHA"
            "$APP_DIR/.venv/bin/pip" install -q -r requirements.txt

            if [ -f "$APP_DIR/deploy/systemd/crmtg.service" ]; then
              install -m 0644 "$APP_DIR/deploy/systemd/crmtg.service" /etc/systemd/system/crmtg.service
              if [ -f "$APP_DIR/deploy/systemd/crmtg-leadgen.service" ]; then
                install -m 0644 "$APP_DIR/deploy/systemd/crmtg-leadgen.service" /etc/systemd/system/crmtg-leadgen.service
                install -m 0644 "$APP_DIR/deploy/systemd/crmtg-leadgen.timer" /etc/systemd/system/crmtg-leadgen.timer
              fi
              systemctl daemon-reload
              if [ -f /etc/systemd/system/crmtg-leadgen.timer ]; then
                systemctl enable --now crmtg-leadgen.timer || true
              fi
            fi

            systemctl restart crmtg.service

            healthy=0
            for i in $(seq 1 60); do
              if hc_json="$(curl -fsS --max-time 3 'http://127.0.0.1:18084/api/health?deep=1' 2>/dev/null)" && printf '%s' "$hc_json" | "$APP_DIR/.venv/bin/python" -c 'import json,sys; d=json.loads(sys.stdin.read()); sys.exit(0 if d.get("db_ok") is True and d.get("reply_alert_guard_ok") is True else 1)'; then
                healthy=1
                break
              fi
              sleep 1
            done

            if [ "$healthy" -ne 1 ]; then
              echo "::error::Healthcheck failed on 127.0.0.1:18084, rolling back to $PREV_SHA"
              git reset --hard "$PREV_SHA"
              "$APP_DIR/.venv/bin/pip" install -q -r requirements.txt
              systemctl restart crmtg.service
              exit 1
            fi

            echo "crmtg deployed and healthy at $TARGET_SHA"
