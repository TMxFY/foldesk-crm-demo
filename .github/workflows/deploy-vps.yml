name: deploy-vps

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite & design/launch gates
        run: |
          python -m pytest -q --ignore=tests/test_v4_block2_snippets.py --ignore=tests/test_v4_block4_kanban_money.py --ignore=tests/test_v4_block6_timeline_focus.py --ignore=tests/test_v5_ui_e2e.py -k "not playwright"
          python .claude/skills/replica-design/contrast.py replica/design/tokens.json
          python .claude/skills/replica-launch/listing.py replica/launch/listing.json

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Contabo VPS (169.58.145.85) with rollback guard
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SERVER_HOST || '169.58.145.85' }}
          username: ${{ vars.SERVER_USER || 'root' }}
          port: ${{ vars.SERVER_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            APP_DIR="/opt/crmtg"
            TARGET_SHA="${{ github.sha }}"
            cd "$APP_DIR"

            PREV_SHA="$(git rev-parse HEAD)"
            echo "Deploying crmtg: $PREV_SHA -> $TARGET_SHA"

            mkdir -p "$APP_DIR/backups"
            if [ -f "$APP_DIR/data/crm.db" ]; then
              "$APP_DIR/.venv/bin/python" -c "import sqlite3; s=sqlite3.connect('$APP_DIR/data/crm.db', timeout=30); d=sqlite3.connect('$APP_DIR/backups/crm.db.pre-${TARGET_SHA:0:8}'); s.backup(d); d.close(); s.close()"
              ls -1t "$APP_DIR/backups"/crm.db.pre-* 2>/dev/null | tail -n +11 | xargs -r rm -f
            fi

            git fetch origin main
            git reset --hard "$TARGET_SHA"
            "$APP_DIR/.venv/bin/pip" install -q -r requirements.txt

            if [ -f "$APP_DIR/deploy/systemd/crmtg.service" ]; then
              install -m 0644 "$APP_DIR/deploy/systemd/crmtg.service" /etc/systemd/system/crmtg.service
              systemctl daemon-reload
            fi

            systemctl restart crmtg.service

            healthy=0
            for i in $(seq 1 60); do
              if curl -fsS --max-time 3 http://127.0.0.1:18084/api/accounts >/dev/null 2>&1; then
                healthy=1
                break
              fi
              sleep 1
            done

            if [ "$healthy" -ne 1 ]; then
              echo "::error::Healthcheck failed on 127.0.0.1:18084, rolling back to $PREV_SHA"
              git reset --hard "$PREV_SHA"
              "$APP_DIR/.venv/bin/pip" install -q -r requirements.txt
              systemctl restart crmtg.service
              exit 1
            fi

            echo "crmtg deployed and healthy at $TARGET_SHA"
