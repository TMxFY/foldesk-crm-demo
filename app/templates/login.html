<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <title>Вход — Foldesk CRM</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/design/tokens.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
</head>
<body class="auth-page-body">
  <main class="auth-page-wrap">
    <section class="surface-box auth-card stack" aria-labelledby="auth-card-title" style="max-width: 420px; margin: 0 auto;">
      <div class="auth-card-header">
        <div class="ws-header auth-ws-brand">
          <span class="ws-logo" aria-hidden="true">F</span>
          <div class="ws-meta">
            <h1 id="auth-card-title" class="brand">Foldesk CRM</h1>
            <span class="ws-sub">Telegram &amp; WhatsApp Sales Workspace</span>
          </div>
        </div>
        <div class="row">
          <span id="auth-current-badge" class="badge b-new" hidden>Проверка сессии...</span>
          <button type="button" id="auth-theme-btn" class="btn ghost sm">Тема</button>
        </div>
      </div>

      <div id="pane-login" class="auth-tab-pane stack">
        <form id="login-page-form" class="stack">
          <label for="login-password">Пароль или быстрый PIN
            <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Введите пароль или PIN доступа" value="" required autofocus>
          </label>

          <div class="row">
            <button type="submit" id="login-submit-btn" class="btn primary sm" style="width: 100%; justify-content: center;">Войти</button>
            <button type="button" id="login-logout-btn" class="btn ghost sm" hidden>Выйти</button>
          </div>

          <details class="login-advanced-toggle">
            <summary>Войти по логину сотрудника</summary>
            <div class="stack" style="margin-top: 10px;">
              <label for="login-username">Логин сотрудника
                <input id="login-username" name="username" type="text" autocomplete="username" placeholder="tim, vlad или operator (необязательно)" value="">
              </label>
              <div class="auth-presets-grid">
                <button type="button" class="auth-preset-card" data-preset-user="tim">
                  <div class="row">
                    <strong>Тимофей</strong>
                    <span class="badge b-won">Admin</span>
                  </div>
                  <code>@tim</code>
                </button>
                <button type="button" class="auth-preset-card" data-preset-user="vlad">
                  <div class="row">
                    <strong>Влад</strong>
                    <span class="badge b-talk">Sales</span>
                  </div>
                  <code>@vlad</code>
                </button>
                <button type="button" class="auth-preset-card" data-preset-user="operator">
                  <div class="row">
                    <strong>Оператор</strong>
                    <span class="badge b-new">Outreach</span>
                  </div>
                  <code>@operator</code>
                </button>
              </div>
            </div>
          </details>
        </form>
      </div>

      <p id="auth-status-msg" class="msg" role="status" hidden></p>

      <div id="auth-users-card" class="surface-subcard stack" hidden>
        <div class="subcard-head">
          <span class="steps-caption">АКТИВНЫЕ ПРОФИЛИ ВОРКСПЕЙСА:</span>
          <span id="auth-users-count" class="badge b-ok">0 акк.</span>
        </div>
        <div id="auth-users-list" class="auth-users-list"></div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      try {
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.dataset.theme = savedTheme;
      } catch (_err) {
        document.documentElement.dataset.theme = "dark";
      }

      const themeBtn = document.querySelector("#auth-theme-btn");
      if (themeBtn) {
        themeBtn.addEventListener("click", () => {
          const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
          document.documentElement.dataset.theme = next;
          try {
            localStorage.setItem("theme", next);
          } catch (_err) {
            /* ignore storage restrictions */
          }
        });
      }

      const statusMsg = document.querySelector("#auth-status-msg");

      function showMsg(text, isError) {
        if (!statusMsg) return;
        statusMsg.hidden = !text;
        statusMsg.textContent = text || "";
        statusMsg.dataset.kind = isError ? "error" : "ok";
      }

      async function apiCall(url, method, body) {
        const res = await fetch(url, {
          method: method || "GET",
          credentials: "same-origin",
          headers: body ? { "Content-Type": "application/json" } : {},
          body: body ? JSON.stringify(body) : undefined,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const fallback = res.status === 429
            ? "Слишком много попыток входа. Подождите немного и попробуйте снова."
            : "Ошибка входа";
          throw new Error(data.detail || data.error || fallback);
        }
        return data;
      }

      async function tryTelegramWebAppAutoLogin() {
        const initData = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData;
        if (!initData) return false;
        try {
          if (window.Telegram.WebApp.ready) window.Telegram.WebApp.ready();
          if (window.Telegram.WebApp.expand) window.Telegram.WebApp.expand();
          showMsg("Вход через Telegram Mini App...", false);
          const res = await apiCall("/api/auth/webapp", "POST", { init_data: initData });
          if (res && res.authenticated) {
            try {
              if (res.user) localStorage.setItem("foldesk_crm_user", JSON.stringify(res.user));
            } catch (_err) {
              /* ignore */
            }
            window.location.href = "/";
            return true;
          }
        } catch (err) {
          showMsg(err.message || "Не удалось войти через Telegram Mini App", true);
        }
        return false;
      }

      async function doLogin(username, password) {
        const btn = document.querySelector("#login-submit-btn");
        if (btn) btn.disabled = true;
        try {
          const res = await apiCall("/api/auth/login", "POST", { username, password });
          if (res && res.user) {
            try {
              localStorage.setItem("foldesk_crm_user", JSON.stringify(res.user));
            } catch (_err) {
              /* ignore */
            }
          }
          showMsg("Вход выполнен: " + (res.user?.display_name || username || "CRM") + ". Переход...", false);
          window.location.href = "/";
        } catch (err) {
          showMsg(err.message || "Ошибка входа", true);
        } finally {
          if (btn) btn.disabled = false;
        }
      }

      document.querySelectorAll("[data-preset-user]").forEach((card) => {
        card.addEventListener("click", () => {
          const u = card.getAttribute("data-preset-user") || "";
          const uInput = document.getElementById("login-username");
          const pInput = document.getElementById("login-password");
          if (uInput) uInput.value = u;
          if (pInput) {
            pInput.value = "";
            pInput.focus();
          }
          showMsg("", false);
        });
      });

      const loginForm = document.querySelector("#login-page-form");
      if (loginForm) {
        loginForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const u = document.getElementById("login-username")?.value.trim() || "";
          const p = document.getElementById("login-password")?.value || "";
          if (!p) {
            showMsg("Введите пароль или PIN доступа", true);
            return;
          }
          doLogin(u, p);
        });
      }

      const logoutBtn = document.querySelector("#login-logout-btn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", async () => {
          await apiCall("/api/auth/logout", "POST").catch(() => {});
          try {
            localStorage.removeItem("foldesk_auth_token");
            localStorage.removeItem("foldesk_crm_user");
          } catch (_err) {
            /* ignore */
          }
          showMsg("Вы вышли из аккаунта", false);
          await loadAuthMe();
        });
      }

      async function loadAuthMe() {
        const autoLogged = await tryTelegramWebAppAutoLogin();
        if (autoLogged) return;
        try {
          const data = await apiCall("/api/auth/me", "GET");
          const badge = document.querySelector("#auth-current-badge");
          if (badge) {
            if (data.authenticated && data.user) {
              badge.hidden = false;
              badge.textContent = "Активен: " + (data.user.display_name || data.user.username);
              badge.className = "badge b-ok";
              if (logoutBtn) logoutBtn.hidden = false;
            } else {
              badge.hidden = true;
              if (logoutBtn) logoutBtn.hidden = true;
            }
          }
        } catch (_err) {
          /* ignore */
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", loadAuthMe);
      } else {
        loadAuthMe();
      }
    })();
  </script>
</body>
</html>
